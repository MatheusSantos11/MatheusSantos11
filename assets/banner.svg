<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Matheus Santos: do circuito ao código. Engenharia de Software, Full-Stack e Cibersegurança.">
  <style>
    .trace { fill: none; stroke: #2c6e68; stroke-width: 2.5; stroke-linejoin: round; }
    .pulse { fill: none; stroke: #6ff0d3; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 70 900; animation: flow 4.5s linear infinite; }
    .p2 { animation-delay: -1.1s; }
    .p3 { animation-delay: -2.3s; }
    .p4 { animation-delay: -3.4s; }
    .node { fill: #4fd1b5; animation: glow 4.5s ease-in-out infinite; }
    .n2 { animation-delay: -1.5s; }
    .n3 { animation-delay: -3s; }
    .caret { animation: blink 1.1s steps(2, start) infinite; }
    .code { font: 500 26px Consolas, "SFMono-Regular", Menlo, monospace; fill: #4fd1b5; }
    .name { font: 700 58px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #f2f6f5; }
    .tag { font: 400 28px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #a9c4c0; }
    .sub { font: 400 21px "Segoe UI", -apple-system, "Helvetica Neue", Arial, sans-serif; fill: #7fa09c; }
    @keyframes flow { from { stroke-dashoffset: 970; } to { stroke-dashoffset: 0; } }
    @keyframes glow { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
    @keyframes blink { to { visibility: hidden; } }
    @media (prefers-reduced-motion: reduce) {
      .pulse { display: none; }
      .node, .caret { animation: none; }
    }
  </style>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#0d1b24"/>
      <stop offset="1" stop-color="#12303a"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="14" fill="url(#bg)"/>

  <g class="trace">
    <path d="M0 62 H170 L212 104 H420"/>
    <path d="M0 128 H120 L160 168 H372"/>
    <path d="M0 214 H220 L250 184 H470"/>
    <path d="M300 48 H440 L482 90 H520"/>
    <path d="M360 240 H440 L482 198 H520"/>
    <path d="M300 280 H480 L520 240"/>
  </g>
  <g>
    <path class="pulse" d="M0 62 H170 L212 104 H420"/>
    <path class="pulse p2" d="M0 128 H120 L160 168 H372"/>
    <path class="pulse p3" d="M0 214 H220 L250 184 H470"/>
    <path class="pulse p4" d="M300 48 H440 L482 90 H520"/>
    <path class="pulse p2" d="M360 240 H440 L482 198 H520"/>
    <path class="pulse p3" d="M300 280 H480 L520 240"/>
  </g>
  <g>
    <circle class="node" cx="420" cy="104" r="6.5"/>
    <circle class="node n2" cx="372" cy="168" r="6.5"/>
    <circle class="node n3" cx="470" cy="184" r="6.5"/>
    <circle class="node" cx="520" cy="90" r="6.5"/>
    <circle class="node n2" cx="520" cy="198" r="6.5"/>
    <circle class="node n3" cx="520" cy="240" r="6.5"/>
    <circle class="node n2" cx="300" cy="48" r="4.5"/>
    <circle class="node n3" cx="360" cy="240" r="4.5"/>
    <circle class="node" cx="300" cy="280" r="4.5"/>
  </g>

  <text class="code" x="580" y="92">&lt;/&gt;<tspan class="caret"> _</tspan></text>
  <text class="name" x="578" y="158">Matheus Santos</text>
  <text class="tag" x="580" y="206">Do circuito ao código</text>
  <text class="sub" x="580" y="244">Engenharia de Software  ·  Full-Stack  ·  Cibersegurança</text>
</svg>
